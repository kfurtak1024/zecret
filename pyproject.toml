[project]
name = "zecret"
version = "0.3.0"
description = "A modern, encrypted terminal diary."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Krzysztof Furtak" }]
keywords = ["diary", "journal", "encryption", "terminal", "tui", "textual", "argon2"]
# No `License ::` classifier: `license` above is an SPDX expression (PEP
# 639), and the two are mutually exclusive rather than merely redundant.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    # 3.13 alone, and deliberately: requires-python permits newer
    # interpreters, but a classifier is a claim of support and nothing
    # here tests one. It goes back when CI runs on it.
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual>=8.2",
    "cryptography>=50.0",
    "argon2-cffi>=25.1",
]

[project.urls]
Homepage = "https://zecret.krfu.dev"
Repository = "https://github.com/kfurtak1024/zecret"
Issues = "https://github.com/kfurtak1024/zecret/issues"

[project.scripts]
zecret = "zecret.__main__:main"

# PEP 735 dependency group: installed by `uv sync` automatically, so a bare
# checkout can run the tests without extra flags.
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "textual-dev>=1.8",
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest-cov>=7.1",
    "hypothesis>=6.165",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zecret"]

# The sdist is published, so it must contain what the project is rather than
# whatever happens to be in the working tree. Hatchling's default is
# everything git does not ignore, which is not the same thing: an untracked
# local file (.claude/settings.local.json was the one that showed up) is not
# ignored, and so was being uploaded. Listed explicitly, so a new stray file
# has to be added here on purpose before it can ship.
#
# The test for a line here is not "is this part of the project?" -- it is
# "does rebuilding or verifying this package need it?". The sdist's reader
# is someone building Zecret from source, most often a distro packager, not
# the person running `pip install`; that one gets the wheel, which is
# src/zecret and nothing else. /tests earns its place on that test, because
# a packager who cannot run the suite cannot vouch for what they ship, and
# nothing in it reaches outside the sdist. Development conveniences do not:
# tools/ and zecret-dev.sh belong to the git checkout, and their entry
# point is `git clone`, not a download from PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/assets",
    "/.github",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
]

[tool.mypy]
# tools/ is committed code that will rot like any other, so it is checked
# too. It can only be checked because the package ships a py.typed marker;
# without one, mypy resolves `zecret` from site-packages and declines to
# look inside it.
files = ["src", "tools"]
strict = true
# The interpreter Zecret is developed, tested and type-checked on, and the
# floor `requires-python` names. Newer ones are permitted but not checked,
# so pinning mypy here is what catches a symbol that only a later version
# has -- before a user on 3.13 finds it instead.
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Neither coverage nor the scale tests are in the default run: a plain
# `uv run pytest` stays fast for the edit-run loop. CI asks for both
# explicitly (`--cov -m ""`), so neither can quietly erode on main.
addopts = ["--strict-markers", "--strict-config", "-m", "not slow"]
xfail_strict = true
asyncio_mode = "auto"
# Pinned explicitly: pytest-asyncio warns when this is left to default.
asyncio_default_fixture_loop_scope = "function"
# Crypto code must not be allowed to pass tests while emitting deprecations.
filterwarnings = ["error"]
markers = [
    # tests/test_scale.py builds a diary of years to check that drawing it
    # has not gone quadratic again. Worth guarding, but it costs seconds
    # where every other test costs milliseconds, so it is deselected above
    # and CI selects it back with `-m ""`.
    "slow: builds a large diary; seconds rather than milliseconds",
]

[tool.coverage.run]
source = ["zecret"]
branch = true

[tool.coverage.report]
# The bar is where the suite already stands, so it can only be raised. What
# is left uncovered is two guards against events the widgets above them
# cannot actually produce -- a click on a disabled row, an out-of-range
# selection -- kept because they are what makes those handlers total.
fail_under = 99
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # The console script is what runs main() in anger; CI smoke-tests it.
    'if __name__ == "__main__":',
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# Matches requires-python: the code has to run on the oldest interpreter
# supported, so the linter has to hold it to that syntax. This is also what
# keeps PEP 758 out — at py314 ruff would rewrite `except (A, B):` as
# `except A, B:`, which is valid there but reads exactly like Python 2's
# `except A, b:`, where the second name bound the exception instead of
# adding to the catch list. If the floor ever rises to 3.14, keep the
# parentheses on purpose rather than letting that rewrite land.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade: keep to modern syntax
    "B",    # bugbear
    "S",    # bandit: security lint
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, hardcoded test passwords, and short crypto
# values that bandit flags in application code.
"tests/**" = ["S101", "S105", "S106", "S311"]
# The screenshot tool opens a throwaway diary with a password written in
# the file, and shells out to a converter it picked from a fixed list.
# Neither is a secret and neither takes untrusted input. The dev-diary
# seeder wants `random` for exactly what S311 says it is for -- plausible
# variety in fake prose, seeded so the same diary comes back. Nothing in
# tools/ derives a key or generates a nonce; that is crypto.py's job, and
# S311 is still on there.
"tools/**" = ["S101", "S105", "S106", "S311", "S603"]
