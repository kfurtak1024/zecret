[project]
name = "zecret"
version = "0.1.0"
description = "A modern, encrypted terminal diary."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Krzysztof Furtak" }]
dependencies = [
    "textual>=8.2",
    "cryptography>=50.0",
    "argon2-cffi>=25.1",
]

[project.urls]
Homepage = "https://zecret.krfu.dev"
Repository = "https://github.com/kfurtak1024/zecret"
Issues = "https://github.com/kfurtak1024/zecret/issues"

[project.scripts]
zecret = "zecret.__main__:main"

# PEP 735 dependency group: installed by `uv sync` automatically, so a bare
# checkout can run the tests without extra flags.
[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "textual-dev>=1.8",
    "ruff>=0.16",
    "mypy>=1.18",
    "pytest-cov>=7",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zecret"]

[tool.mypy]
files = ["src"]
strict = true
# Zecret targets exactly one interpreter (see .python-version); there is no
# older version to stay compatible with.
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Neither coverage nor the scale tests are in the default run: a plain
# `uv run pytest` stays fast for the edit-run loop. CI asks for both
# explicitly (`--cov -m ""`), so neither can quietly erode on main.
addopts = ["--strict-markers", "--strict-config", "-m", "not slow"]
xfail_strict = true
asyncio_mode = "auto"
# Pinned explicitly: pytest-asyncio warns when this is left to default.
asyncio_default_fixture_loop_scope = "function"
# Crypto code must not be allowed to pass tests while emitting deprecations.
filterwarnings = ["error"]
markers = [
    # tests/test_scale.py builds a diary of years to check that drawing it
    # has not gone quadratic again. Worth guarding, but it costs seconds
    # where every other test costs milliseconds, so it is deselected above
    # and CI selects it back with `-m ""`.
    "slow: builds a large diary; seconds rather than milliseconds",
]

[tool.coverage.run]
source = ["zecret"]
branch = true

[tool.coverage.report]
# The bar is where the suite already stands, so it can only be raised. What
# is left uncovered is two guards against events the widgets above them
# cannot actually produce -- a click on a disabled row, an out-of-range
# selection -- kept because they are what makes those handlers total.
fail_under = 99
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # The console script is what runs main() in anger; CI smoke-tests it.
    'if __name__ == "__main__":',
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# Deliberately one below requires-python. Ruff would otherwise apply PEP 758
# and rewrite `except (A, B):` as `except A, B:` — which is valid in 3.14 but
# reads exactly like Python 2's `except A, b:`, where the second name bound
# the exception instead of adding to the catch list. The parentheses cost
# nothing and remove that ambiguity. Raise this to py314 to opt in.
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade: keep to modern syntax
    "B",    # bugbear
    "S",    # bandit: security lint
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, hardcoded test passwords, and short crypto
# values that bandit flags in application code.
"tests/**" = ["S101", "S105", "S106", "S311"]
