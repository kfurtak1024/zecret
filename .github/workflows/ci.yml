name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to full commit SHAs, with the version in a trailing
# comment. Tags are mutable and not every action publishes a floating major
# tag, so a SHA is both the reproducible choice and the one that cannot be
# repointed under us. Dependabot bumps these and rewrites the comment.

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every uv command asserts uv.lock is present and current, and fails if
  # pyproject.toml changed without re-locking. Set here rather than as a
  # --locked flag so it covers `uv run` too, not just `uv sync`.
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check --diff .

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both ends of requires-python, and nothing in between: 3.13 is the floor
    # the package claims to support, 3.14 is what a system Python is
    # increasingly likely to be. Testing only one of them would leave the
    # metadata promising more than CI checks. Lint and types are not matrixed
    # -- ruff's target-version and mypy's python_version are both pinned to
    # the floor in pyproject.toml, so running them twice would prove nothing.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # python-version overrides .python-version for this leg; that file
      # stays the single source of truth for a local checkout.
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # --cov and `-m ""` here rather than in addopts: a local
      # `uv run pytest` stays quick, skipping coverage and the scale tests,
      # while neither can quietly erode on main. `-m ""` overrides the
      # `-m "not slow"` default and selects everything; the coverage
      # threshold lives in pyproject.toml under [tool.coverage.report].
      - name: Run tests
        run: uv run pytest -q --cov -m ""

      # Catches packaging breakage the test suite cannot: the console
      # script is only wired up when the project is actually installed.
      - name: Smoke-test the entry point
        run: uv run zecret --help

  # A single required check to protect the branch with, so jobs can be
  # added or removed without editing branch protection rules.
  ci:
    name: CI
    if: always()
    needs: [lint, types, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo "All checks passed."
