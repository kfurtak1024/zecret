name: Pages

# The product page at docs/index.html. Separate from CI on purpose: it has
# nothing to do with whether the code is sound, and a page typo should not
# read as a failing build on a commit that only touched prose.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Actions are pinned to full commit SHAs, with the version in a trailing
# comment, matching ci.yml. Dependabot bumps these and rewrites the comment.

# Least privilege: the build only reads the repository. The deploy job asks
# for the two extra scopes it needs, and nothing else inherits them.
permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-finished
# deploy that gets cancelled leaves the live site on the old version with
# nothing queued to fix it. Superseded runs simply wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No actions/configure-pages step: that exists to feed a base path
      # into a static site generator and to auto-enable Pages. This is one
      # hand-written file with relative links, so it would only be another
      # pinned action to keep current.
      - name: Upload docs/ as the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
