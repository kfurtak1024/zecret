version: 2

updates:
  # Keep the workflow's actions current. Security fixes to actions land
  # here, and pinned major versions otherwise drift out of support.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Keep uv.lock current. This matters more than usual for Zecret: a
  # cryptography or argon2-cffi advisory should surface as a pull request,
  # not wait for someone to notice.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      # One PR for routine dev-tool bumps; crypto dependencies stay
      # separate so they get looked at on their own.
      #
      # Every entry in [dependency-groups] belongs here, and the list is
      # spelled out rather than inferred: a dev tool missing from it does
      # not fail anything, it just arrives as its own pull request, which
      # is how hypothesis came through alone twice before it was noticed.
      # `pytest*` already covers pytest-asyncio and pytest-cov; the rest
      # match nothing but themselves.
      dev-tools:
        patterns:
          - ruff
          - mypy
          - pytest*
          - hypothesis
          - textual-dev
